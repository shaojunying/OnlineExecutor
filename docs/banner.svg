<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="OnlineExecutor: write Java in the browser. The server compiles it in memory and runs it in one of three modes: in the server JVM as in the book, in a child JVM with limits, or in a locked-down Docker container.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcb6b"/>
      <stop offset="0.55" stop-color="#f6a35b"/>
      <stop offset="1" stop-color="#81c995"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
      .head { font-size: 15px; font-weight: 600; fill: #e6edf3; }
      .sub { font-size: 12px; fill: #8b949e; }
      .code { font-size: 13px; fill: #e6edf3; }
      .chip { font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>

  <!-- logo: a coffee cup with steam -->
  <g transform="translate(118 96)">
    <path d="M-14 -58 q-8 -10 0 -20 q8 -10 0 -20" fill="none" stroke="#9da7b3" stroke-width="4" stroke-linecap="round" transform="translate(0 20)"/>
    <path d="M8 -58 q-8 -10 0 -20 q8 -10 0 -20" fill="none" stroke="#9da7b3" stroke-width="4" stroke-linecap="round" transform="translate(0 20)"/>
    <path d="M-40 -26 h72 v34 a36 30 0 0 1 -36 30 a36 30 0 0 1 -36 -30 z" fill="#0d1117" stroke="#ffcb6b" stroke-width="7" stroke-linejoin="round"/>
    <path d="M32 -14 h8 a14 14 0 0 1 0 28 h-8" fill="none" stroke="#ffcb6b" stroke-width="7" stroke-linecap="round"/>
    <text x="-4" y="12" text-anchor="middle" class="mono" font-size="24" font-weight="700" fill="#81c995">{ }</text>
    <line x1="-48" y1="48" x2="40" y2="48" stroke="#ffcb6b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="200" y="104" font-size="60" font-weight="700" fill="url(#title)">OnlineExecutor</text>
  <text x="202" y="144" font-size="22" fill="#9da7b3">Write Java in the browser. The server compiles it in memory and runs it</text>
  <text x="202" y="174" font-size="22" fill="#9da7b3">in the server JVM, in a child JVM, or in a <tspan fill="#81c995" font-weight="600">locked-down container</tspan>.</text>

  <!-- pipeline panel -->
  <g transform="translate(80 204)">
    <rect width="1120" height="190" rx="12" fill="#161b22" stroke="#30363d"/>

    <!-- source -->
    <rect x="24" y="44" width="250" height="102" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="38" y="66" class="sub mono">Main.java</text>
    <text x="38" y="92" class="code mono"><tspan fill="#c58af9">public class</tspan> Main {</text>
    <text x="58" y="112" class="code mono">System.out.println(42);</text>
    <text x="38" y="132" class="code mono">}</text>

    <line x1="282" y1="95" x2="318" y2="95" stroke="#6e7681" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- compiler -->
    <rect x="326" y="58" width="170" height="74" rx="8" fill="#0d1117" stroke="#ffcb6b"/>
    <text x="411" y="88" text-anchor="middle" class="head">javac</text>
    <text x="411" y="110" text-anchor="middle" class="sub">in memory, no files</text>

    <path d="M504 95 C 540 95, 540 42, 576 42" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="504" y1="95" x2="576" y2="95" stroke="#6e7681" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M504 95 C 540 95, 540 148, 576 148" fill="none" stroke="#6e7681" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- mode 1: in-process -->
    <rect x="584" y="20" width="512" height="44" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="600" y="47" class="head mono">in-process</text>
    <rect x="726" y="31" width="96" height="22" rx="11" fill="#3a3220"/>
    <text x="774" y="46" text-anchor="middle" class="chip" fill="#ffcb6b">book §9.3</text>
    <rect x="830" y="31" width="104" height="22" rx="11" fill="#3a2a2e"/>
    <text x="882" y="46" text-anchor="middle" class="chip" fill="#f28b82">no isolation</text>

    <!-- mode 2: process -->
    <rect x="584" y="73" width="512" height="44" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="600" y="100" class="head mono">process</text>
    <rect x="726" y="84" width="88" height="22" rx="11" fill="#1f3326"/>
    <text x="770" y="99" text-anchor="middle" class="chip" fill="#81c995">child JVM</text>
    <rect x="822" y="84" width="170" height="22" rx="11" fill="#1f3326"/>
    <text x="907" y="99" text-anchor="middle" class="chip" fill="#81c995">timeout · heap · output</text>

    <!-- mode 3: docker -->
    <rect x="584" y="126" width="512" height="44" rx="8" fill="#0d1117" stroke="#81c995"/>
    <text x="600" y="153" class="head mono">docker</text>
    <rect x="726" y="137" width="94" height="22" rx="11" fill="#1f2a3d"/>
    <text x="773" y="152" text-anchor="middle" class="chip" fill="#8ab4f8">no network</text>
    <rect x="828" y="137" width="84" height="22" rx="11" fill="#1f2a3d"/>
    <text x="870" y="152" text-anchor="middle" class="chip" fill="#8ab4f8">read-only</text>
    <rect x="920" y="137" width="160" height="22" rx="11" fill="#1f2a3d"/>
    <text x="1000" y="152" text-anchor="middle" class="chip" fill="#8ab4f8">memory · CPU · pids</text>
  </g>
</svg>
