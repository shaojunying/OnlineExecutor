<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OnlineExecutor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/webjars/codemirror/lib/codemirror.css">
    <link rel="stylesheet" href="/webjars/codemirror/theme/material-darker.css">
    <link rel="stylesheet" href="/webjars/codemirror/theme/idea.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="logo" aria-hidden="true">☕</span>
        <h1>OnlineExecutor</h1>
        <span class="tagline">在浏览器里编译并运行 Java</span>
    </div>
    <div class="runtime" id="runtime" title="服务端运行模式">加载中…</div>
    <a class="github" href="https://github.com/shaojunying/OnlineExecutor" target="_blank" rel="noopener">GitHub</a>
</header>

<main class="workspace">
    <section class="panel editor-panel" aria-label="代码编辑器">
        <div class="panel-header">
            <span class="file-name" id="file-name">Main.java</span>
            <div class="toolbar">
                <label class="visually-hidden" for="examples">示例</label>
                <select id="examples">
                    <option value="">示例代码…</option>
                </select>
                <button type="button" class="button primary" id="run" title="Ctrl + Enter">
                    <span class="run-icon" aria-hidden="true">▶</span>
                    <span id="run-label">运行</span>
                </button>
            </div>
        </div>
        <textarea id="source" aria-label="Java 源代码"></textarea>
        <div class="panel-footer">
            <kbd>Ctrl</kbd> + <kbd>Enter</kbd> 运行 · 代码自动保存在本地浏览器
        </div>
    </section>

    <section class="side">
        <section class="panel stdin-panel" aria-label="标准输入">
            <div class="panel-header">
                <span>标准输入 (stdin)</span>
            </div>
            <textarea id="stdin" spellcheck="false" placeholder="程序从 System.in 读取的内容"></textarea>
        </section>

        <section class="panel output-panel" aria-label="运行结果">
            <div class="panel-header">
                <span>运行结果</span>
                <div class="meta">
                    <span class="status" id="status" hidden></span>
                    <span class="stat" id="stats"></span>
                    <button type="button" class="button ghost" id="clear">清空</button>
                </div>
            </div>
            <div class="output" id="output" aria-live="polite">
                <p class="placeholder">运行后，这里显示程序输出。</p>
            </div>
        </section>
    </section>
</main>

<script src="/webjars/codemirror/lib/codemirror.js"></script>
<script src="/webjars/codemirror/mode/clike/clike.js"></script>
<script src="/webjars/codemirror/addon/edit/matchbrackets.js"></script>
<script src="/webjars/codemirror/addon/edit/closebrackets.js"></script>
<script src="/js/examples.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
