name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # DockerRunnerTest runs only when this image is present.
      - name: Pull sandbox image
        run: docker pull eclipse-temurin:${{ matrix.java }}-jre

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: matrix.java == 21
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: online-executor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
